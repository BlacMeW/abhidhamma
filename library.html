    <script>
        // PDF Loading Logic
        function loadPDF(filename, btnElement) {
            // Update active state
            document.querySelectorAll('.book-item').forEach(el => {
                el.classList.remove('active-book');
                el.classList.remove('border-sky-400');
                el.classList.add('border-slate-200', 'dark:border-slate-800');
            });
            
            btnElement.classList.add('active-book');
            
            // Show loading
            const loader = document.getElementById('pdfLoading');
            const frame = document.getElementById('pdfFrame');
            
            loader.classList.remove('hidden');
            
            // Load PDF
            // Using encodeURIComponent for Myanmar filenames
            frame.src = `assets/docs/${encodeURIComponent(filename)}`;
            
            // Hide loading after a delay (iframe onload is unreliable for PDFs across browsers)
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 1000);
            
            // On mobile, scroll to iframe
            if (window.innerWidth < 768) {
                setTimeout(() => {
                    frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }
        
        // Handle iframe load event as fallback
        document.getElementById('pdfFrame').onload = function() {
            document.getElementById('pdfLoading').classList.add('hidden');
        };

        // Resizable Sidebar Logic
        const resizer = document.getElementById('resizer');
        const sidebar = document.getElementById('sidebar');
        
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; // Prevent text selection
            document.getElementById('pdfFrame').style.pointerEvents = 'none'; // Prevent iframe capturing mouse
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            // Limit sidebar width between 250px and 50vw
            const newWidth = Math.max(250, Math.min(e.clientX, window.innerWidth / 2));
            sidebar.style.width = newWidth + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.getElementById('pdfFrame').style.pointerEvents = 'auto';
            }
        });
    </script>
