    <main class="max-w-4xl mx-auto px-4 mt-8 flex-1 w-full space-y-6">
        <div class="text-center space-y-3">
            <h2 class="text-2xl md:text-3xl font-bold">ဝေါဟာရများကို အလွယ်တကူ ရှာဖွေပါ</h2>
            <p class="text-slate-600 dark:text-slate-400 text-sm">အဘိဓမ္မာကျမ်းလာ အရေးကြီးသော ပါဠိဝေါဟာရများကို ဤနေရာတွင် ရှာဖွေလေ့လာနိုင်ပါသည်။</p>
            
            <div class="relative max-w-lg mx-auto mt-6">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-slate-500"></i>
                </div>
                <input type="text" id="searchInput" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-full py-3 pl-11 pr-4 text-slate-800 dark:text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-inner" placeholder="ဝေါဟာရ (သို့) အဓိပ္ပာယ်ကို ရှာဖွေပါ...">
                <button id="clearSearch" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 dark:text-slate-500 hover:text-slate-700 dark:text-slate-300 hidden">

        <div id="glossaryList" class="space-y-3 mt-8">

    <script>
        const terms = [
            { term: 'Citta (စိတ္တ)', meaning: 'အာရုံကို သိတတ်သော သဘော (စိတ်)' },
            { term: 'Cetasika (စေတသိက)', meaning: 'စိတ်နှင့် ယှဉ်တွဲ၍ ဖြစ်ပေါ်သော၊ စိတ်ကို ခြယ်လှယ်တတ်သော သဘောတရားများ (စေတသိက်)' },
            { term: 'Rūpa (ရူပ)', meaning: 'ဖောက်ပြန်တတ်သော သဘော (ရုပ်တရား)' },
            { term: 'Nibbāna (နိဗ္ဗာန)', meaning: 'တဏှာမှ ကင်းလွတ်ရာ၊ ဒုက္ခငြိမ်းရာ (နိဗ္ဗာန်)' },
            { term: 'Asaṅkhārika (အသင်္ခါရိက)', meaning: 'တိုက်တွန်းမှု မပါဘဲ မိမိအလိုအလျောက် ထက်မြက်စွာ ဖြစ်ပေါ်သော စိတ်' },
            { term: 'Sasaṅkhārika (သသင်္ခါရိက)', meaning: 'မိမိ/သူတစ်ပါး၏ တိုက်တွန်းမှုကြောင့် နှေးကွေးစွာ ဖြစ်ပေါ်သော စိတ်' },
            { term: 'Ahetuka (အဟေတုက)', meaning: 'ဟေတု (လောဘ၊ ဒေါသ စသည့် အမြစ်) မပါဝင်သော စိတ်' },
            { term: 'Sahetuka (သဟေတုက)', meaning: 'ဟေတု ပါဝင်သော စိတ်' },
            { term: 'Kusala (ကုသလ)', meaning: 'အပြစ်ကင်း၍ ကောင်းသောအကျိုးကို ပေးတတ်သော သဘော (ကုသိုလ်)' },
            { term: 'Akusala (အကုသလ)', meaning: 'အပြစ်ရှိ၍ ဆင်းရဲသောအကျိုးကို ပေးတတ်သော သဘော (အကုသိုလ်)' },
            { term: 'Vipāka (ဝိပါက)', meaning: 'ကံ၏ အကျိုးဆက်အဖြစ် ဖြစ်ပေါ်လာသော သဘော (ဝိပါက်)' },
            { term: 'Kiriya / Kriyā (ကြိယာ)', meaning: 'အကျိုး မပေးတော့သော၊ ပြုကာမတ္တမျှသာဖြစ်သော သဘော (ရဟန္တာများ၏ စိတ်)' },
            { term: 'Vīthi (ဝီထိ)', class: 'text-sky-700 dark:text-sky-300', meaning: 'အာရုံကို သိရှိရန် အစဉ်အတိုင်း ဖြစ်ပေါ်သော စိတ်အစဉ်' },
            { term: 'Bhavaṅga (ဘဝင်)', meaning: 'ဘဝ၏ အင်္ဂါ၊ ဘဝကို ဆက်စပ်ပေးသော၊ ဝီထိစိတ် မဖြစ်ပေါ်ချိန်တွင် ဖြစ်ပေါ်နေသော စိတ်' },
            { term: 'Javana (ဇောန / ဇော)', meaning: 'အာရုံ၏ အရသာကို လျင်မြန်စွာ ခံစားသော၊ ကံမြောက်စေသော စိတ်' },
            { term: 'Paṭisandhi (ပဋိသန္ဓေ)', meaning: 'ဘဝဟောင်းနှင့် ဘဝသစ်ကို ဆက်စပ်ပေးသော၊ ဘဝသစ်၏ ပထမဆုံး စိတ်' },
            { term: 'Cuti (စုတိ)', meaning: 'ဘဝတစ်ခု၏ နောက်ဆုံး ပြတ်စဲသွားသော စိတ်' },
            { term: 'Uppāda (ဥပါဒ်)', meaning: 'စတင်ဖြစ်ပေါ်ခြင်း ခဏ' },
            { term: 'Ṭhiti (ဌီ)', meaning: 'တည်နေခြင်း ခဏ' },
            { term: 'Bhaṅga (ဘင်)', meaning: 'ချုပ်ပျောက်ခြင်း ခဏ' },
            { term: 'Kicca (ကိစ္စ)', meaning: 'စိတ်၏ လုပ်ငန်းဆောင်တာ (၁၄ မျိုး ရှိသည်)' },
            { term: 'Dvāra (ဒွါရ)', meaning: 'စိတ်ဖြစ်ပေါ်ရန် ဝင်ပေါက်/ထွက်ပေါက် (တံခါး ၆ ပေါက်)' },
            { term: 'Ārammaṇa (အာရမ္မဏ)', meaning: 'စိတ်၏ မှီတွယ်ရာ/သိစရာ (အာရုံ ၆ ပါး)' },
            { term: 'Vatthu (ဝတ္ထု)', meaning: 'စိတ် မှီရာ ရုပ်အခြေခံ (ဝတ္ထုရုပ် ၆ ပါး)' },
            { term: 'Paccaya (ပစ္စယ)', meaning: 'တစ်ခုက တစ်ခုကို ထောက်ပံ့ ကျေးဇူးပြုတတ်သော အခြေအနေ' },
            { term: 'Kammaṭṭhāna (ကမ္မဋ္ဌာန)', meaning: 'ဘာဝနာအလုပ်၏ တည်ရာ အာရုံ' },
            { term: 'Samatha (သမထ)', meaning: 'စိတ်ကို ငြိမ်းအေး တည်ငြိမ်စေသော အကျင့်' },
            { term: 'Vipassanā (ဝိပဿနာ)', meaning: 'ရုပ်နာမ်တို့၏ အနိစ္စ၊ ဒုက္ခ၊ အနတ္တ သဘောကို အထူး သိမြင်အောင် ရှုပွားသော အကျင့်' },
            { term: 'Jhāna (ဈာန / ဈာန်)', meaning: 'အာရုံကို စူးစိုက်စွာ ရှုတတ်သော၊ ဆန့်ကျင်ဘက် နီဝရဏတရားများကို လောင်ကျွမ်းစေတတ်သော သဘော' },
            { term: 'Magga (မဂ္ဂ / မဂ်)', meaning: 'နိဗ္ဗာန်သို့ သွားရာလမ်း၊ ကိလေသာများကို ပယ်သတ်တတ်သော သဘော' },
            { term: 'Phala (ဖလ / ဖိုလ်)', meaning: 'မဂ်၏ အကျိုးဆက်အဖြစ် ဖြစ်ပေါ်လာသော သဘော' },
            { term: 'Kilesā (ကိလေသာ)', meaning: 'စိတ်ကို ပူလောင် ညစ်နွမ်းစေတတ်သော သဘော' },
            { term: 'Khandha (ခန္ဓာ)', meaning: 'အစုအဝေး (ဥပမာ - ရူပက္ခန္ဓာ၊ ဝေဒနာက္ခန္ဓာ စသည်)' },
            { term: 'Āyatana (အာယတန)', meaning: 'စိတ်နှင့် စေတသိက်တို့ ဖြစ်ပေါ်ကျယ်ပြန့်ရာ အကြောင်း (ဥပမာ - စက္ခာယတန၊ ရူပါယတန စသည်)' },
            { term: 'Dhātu (ဓာတု / ဓာတ်)', meaning: 'သတ္တဝါ၊ ဇီဝ မဟုတ်ဘဲ မိမိသဘောကို ဆောင်သော တရား (ဥပမာ - ပထဝီဓာတ်၊ စက္ခုဓာတ် စသည်)' },
            { term: 'Indriya (ဣန္ဒြိယ / ဣန္ဒြေ)', meaning: 'မိမိဆိုင်ရာ ကိစ္စ၌ အစိုးရသော၊ လွှမ်းမိုးနိုင်သော သဘော (ဥပမာ - စက္ခုန္ဒြေ၊ သဒ္ဓိန္ဒြေ စသည်)' },
            { term: 'Sacca (သစ္စ / သစ္စာ)', meaning: 'ဖောက်ပြန်လွဲမှားမှု မရှိသော အမှန်တရား (ဥပမာ - ဒုက္ခသစ္စာ၊ သမုဒယသစ္စာ စသည်)' },
            { term: 'Paṭiccasamuppāda (ပဋိစ္စသမုပ္ပါဒ)', meaning: 'အကြောင်းတရားများအပေါ် အမှီသဟဲပြု၍ အကျိုးတရားများ ဆက်စပ်ဖြစ်ပေါ်လာခြင်း သဘော' },
            { term: 'Paṭṭhāna (ပဋ္ဌာန / ပဋ္ဌာန်း)', meaning: 'အကြောင်းအကျိုး ဆက်စပ်မှုတို့ကို အထူး၊ အပြားအားဖြင့် ပြဆိုထားသော ကျမ်း (ပစ္စည်း ၂၄ ပါး)' },
            { term: 'Kamma (ကမ္မ / ကံ)', meaning: 'ပြုလုပ်ခြင်း၊ စီမံခြင်း (ကိုယ်၊ နှုတ်၊ စိတ်ဖြင့် ပြုလုပ်သော အကြောင်းတရား)' },
            { term: 'Hetu (ဟေတု / ဟိတ်)', meaning: 'အမြစ်သဖွယ်ဖြစ်သော အကြောင်းတရား (ဥပမာ - လောဘ၊ ဒေါသ၊ မောဟ၊ အလောဘ၊ အဒေါသ၊ အမောဟ)' },
            { term: 'Sampayutta (သမ္ပယုတ္တ)', meaning: 'ယှဉ်တွဲခြင်း၊ အတူတကွ ဖြစ်ပေါ်ခြင်း (ဥပမာ - ဉာဏသမ္ပယုတ်)' },
            { term: 'Vippayutta (ဝိပ္ပယုတ္တ)', meaning: 'မယှဉ်တွဲခြင်း၊ ကင်းကွာခြင်း (ဥပမာ - ဉာဏဝိပ္ပယုတ်)' },
            { term: 'Bhūmi (ဘူမိ / ဘုံ)', meaning: 'သတ္တဝါတို့ ဖြစ်တည်ရာ အရပ်၊ နေရာ (ဥပမာ - ကာမဘုံ၊ ရူပဘုံ၊ အရူပဘုံ)' },
            { term: 'Nimitta (နိမိတ္တ / နိမိတ်)', meaning: 'အာရုံ၏ အမှတ်အသား (ဥပမာ - ပရိကမ္မနိမိတ်၊ ဥဂ္ဂဟနိမိတ်၊ ပဋိဘာဂနိမိတ်)' },
            { term: 'Saṅkhāra (သင်္ခါရ)', meaning: 'အကြောင်းတရားတို့က ပြုပြင်စီရင်ထားသော တရား၊ ပြုပြင်တတ်သော စေတနာ' },
            { term: 'Paññatti (ပညတ္တိ / ပညတ်)', meaning: 'အမှန်တကယ် မရှိသော်လည်း ခေါ်ဝေါ်သမုတ်ထားသော အမည်နာမ သို့မဟုတ် အရာဝတ္ထု' },
            { term: 'Paramattha (ပရမတ္ထ / ပရမတ်)', meaning: 'ဖောက်ပြန်လွဲမှားခြင်း မရှိသော၊ အမှန်တကယ် ရှိသော တရား (စိတ်၊ စေတသိက်၊ ရုပ်၊ နိဗ္ဗာန်)' }
        ];

        // Sort terms alphabetically by english equivalent mostly
        terms.sort((a, b) => a.term.localeCompare(b.term));

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        const listEl = document.getElementById('glossaryList');
        const countEl = document.getElementById('resultCount');

        function highlight(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function render(query = '') {
            const q = query.toLowerCase().trim();
            const filtered = terms.filter(t => t.term.toLowerCase().includes(q) || t.meaning.toLowerCase().includes(q));
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-slate-500 dark:text-slate-500 py-8">ရှာဖွေမှု ရလဒ် မတွေ့ရှိပါ</div>`;
            } else {
                listEl.innerHTML = filtered.map(t => `
                    <div class="glass-card p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-emerald-400 dark:border-emerald-500/30 transition flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <div class="md:w-1/3 font-bold text-emerald-700 dark:text-emerald-300 text-lg">
                            ${highlight(t.term, q)}
                        </div>
                        <div class="md:w-2/3 text-slate-700 dark:text-slate-300 text-sm md:text-base leading-relaxed">
                            ${highlight(t.meaning, q)}
                        </div>
                    </div>
                `).join('');
            }
            countEl.textContent = `စုစုပေါင်း ဝေါဟာရ (${filtered.length}) ခု ပြသထားပါသည်`;
            clearBtn.classList.toggle('hidden', q === '');
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            render();
            searchInput.focus();
        });

        // Init
        render();
    </script>

    <script src="accessibility.js"></script>
</body>
</html>
