        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

            htmlElement.classList.remove('dark');
            htmlElement.classList.add('light');
        } else {
            htmlElement.classList.add('dark');
            htmlElement.classList.remove('light');
        }

            const isDark = htmlElement.classList.contains('dark');
            htmlElement.classList.toggle('dark', !isDark);
            htmlElement.classList.toggle('light', isDark);

- ကသိုဏ်း (၁၀)
  - ပထဝီ
    - မြေ
  - အာပေါ
    - ရေ
  - တေဇော
    - မီး
  - ဝါယော
    - လေ
  - နီလ
    - အညို
  - ပီတ
    - အဝါ
  - လောဟိတ
    - အနီ
  - ဩဒါတ
    - အဖြူ
  - အာလောက
    - အလင်းရောင်
  - အာကာသ
    - ကောင်းကင်/အာကာသ
- အသုဘ (၁၀)
  - ဥဒ္ဓုမာတက
    - ဖူးရောင်နေသော အလောင်း
  - ဝိနီလက
    - ညိုမည်းနေသော အလောင်း
  - ဝိပုဗ္ဗက
    - ပြည်ယိုကျနေသော အလောင်း
  - ဝိစ္ဆိဒ္ဒက
    - ပြတ်တောက်နေသော အလောင်း
  - ဝိက္ခာယိတက
    - တိရစ္ဆာန်တို့ ကိုက်ခဲထားသော အလောင်း
  - ဝိက္ခိတ္တက
    - ဖရိုဖရဲကြဲ흩နေသော အလောင်း
  - ဟတဝိက္ခိတ္တက
    - ဓားလှံစသည်တို့ဖြင့် ခုတ်ထစ်ထားသော အလောင်း
  - လောဟိတက
    - သွေးသံရဲရဲဖြစ်နေသော အလောင်း
  - ပုဠုဝက
    - ပိုးလောက်တို့ဖြင့် ပြည့်နှက်နေသော အလောင်း
  - အဋ္ဌိက
    - အရိုးစုအလောင်း
- အနုဿတိ (၁၀)
  - ဗုဒ္ဓါနုဿတိ
    - ဘုရားဂုဏ်ကို အောက်မေ့ခြင်း
  - ဓမ္မာနုဿတိ
    - တရားဂုဏ်ကို အောက်မေ့ခြင်း
  - သံဃာနုဿတိ
    - သံဃာ့ဂုဏ်ကို အောက်မေ့ခြင်း
  - သီလာနုဿတိ
    - မိမိသီလကို အောက်မေ့ခြင်း
  - စာဂါနုဿတိ
    - မိမိအလှူကို အောက်မေ့ခြင်း
  - ဒေဝတာနုဿတိ
    - နတ်တို့၏ အရည်အချင်းကို အောက်မေ့ခြင်း
  - ဥပသမာနုဿတိ
    - နိဗ္ဗာန်၏ ငြိမ်းချမ်းမှုကို အောက်မေ့ခြင်း
  - မရဏာနုဿတိ
    - သေခြင်းတရားကို အောက်မေ့ခြင်း
  - ကာယဂတာသတိ
    - ခန္ဓာကိုယ်၏ အဆင်းသဏ္ဌာန်ကို အောက်မေ့ခြင်း
  - အာနာပါနဿတိ
    - ထွက်သက်ဝင်သက်ကို အောက်မေ့ခြင်း
- အပ္ပမညာ (၄)
  - မေတ္တာ
    - ချစ်ခင်ကြင်နာမှု
  - ကရုဏာ
    - သနားကြင်နာမှု
  - မုဒိတာ
    - ဝမ်းမြောက်မှု
  - ဥပေက္ခာ
    - လျစ်လျူရှုမှု/အညီအမျှထားမှု
- အာရုပ္ပ (၄)
  - အာကာသာနဉ္စာယတန
    - ကောင်းကင်ပညတ်ကို အာရုံပြုသောစိတ်
    - ကောင်းကင်ပညတ်ကို အာရုံပြုခြင်း
  - ဝိညာဏဉ္စာယတန
    - အာကာသာနဉ္စာယတနစိတ်ကို အာရုံပြုသောစိတ်
    - ပထမအရူပဝိညာဉ်ကို အာရုံပြုခြင်း
  - အာကိဉ္စညာယတန
    - အာကာသာနဉ္စာယတနစိတ်၏ မရှိခြင်းကို အာရုံပြုသောစိတ်
    - ဘာမျှမရှိခြင်းကို အာရုံပြုခြင်း
  - နေဝသညာနာသညာယတန
    - အလွန်သိမ်မွေ့သော သညာရှိသောစိတ်
    - တတိယအရူပဝိညာဉ်ကို အာရုံပြုခြင်း
- သညာ (၁) 
  - အာဟာရေပဋိကူလသညာ
    - အစာအာဟာရ၌ စက်ဆုပ်ဖွယ်ဟု အမှတ်အသားပြုခြင်း
- ဝဝတ္ထာန် (၁) 
  - စတုဓာတုဝဝတ္ထာန်
    - ဓာတ်ကြီး ၄ ပါးကို ပိုင်းခြားမှတ်သားခြင်း
### ဝိပဿနာ 
- လက္ခဏာ (၃) ပါး
  - အနိစ္စ
    - မမြဲခြင်း
  - ဒုက္ခ
    - ဆင်းရဲခြင်း
  - အနတ္တ
    - အစိုးမရ ကိုယ်ပိုင်အနှစ်သာရမရှိခြင်း
- အနုပဿနာ (၃) ပါး
  - အနိစ္စာနုပဿနာ
    - မမြဲဟု ရှုခြင်း
  - ဒုက္ခာနုပဿနာ
    - ဆင်းရဲဟု ရှုခြင်း
  - အနတ္တာနုပဿနာ
    - အစိုးမရဟု ရှုခြင်း
- ဝိမောက္ခ (၃) ပါး
  - သုညတ
    - အနတ္တကို ရှု၍ လွတ်မြောက်ခြင်း
  - အနိမိတ္တ
    - အနိစ္စကို ရှု၍ လွတ်မြောက်ခြင်း
  - အပ္ပဏိဟိတ
    - ဒုက္ခကို ရှု၍ လွတ်မြောက်ခြင်း
- ဝိသုဒ္ဓိ (၇) ပါး
  - သီလ ဝိသုဒ္ဓိ
  - စိတ္တ ဝိသုဒ္ဓိ
  - ဒိဋ္ဌိ ဝိသုဒ္ဓိ
  - ကင်္ခါဝိတရဏ ဝိသုဒ္ဓိ
  - မဂ္ဂါမဂ္ဂဉာဏဒဿန ဝိသုဒ္ဓိ
  - ပဋိပဒါဉာဏဒဿန ဝိသုဒ္ဓိ
  - ဉာဏဒဿန ဝိသုဒ္ဓိ
- ဉာဏ်စဉ် (၁၀) ပါး
  - သမ္မသနဉာဏ်
  - ဥဒယဗ္ဗယဉာဏ်
  - ဘင်္ဂဉာဏ်
  - ဘယဉာဏ်
  - အာဒီနဝဉာဏ်
  - နိဗ္ဗိဒါဉာဏ်
  - မုဉ္စိတုကမျတာဉာဏ်
  - ပဋိသင်္ခါဉာဏ်
  - သင်္ခါရုပေက္ခာဉာဏ်
  - အနုလောမဉာဏ်
`;

        let mm;
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const { Transformer } = window.markmap;
                const { Markmap } = window.markmap;

                const transformer = new Transformer();
                const { root } = transformer.transform(markdown);
                
                // Set high contrast bright colors for branches in dark mode, and darker for light mode
                const isDark = document.documentElement.classList.contains('dark');
                const darkColors = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#c084fc', '#2dd4bf', '#fb923c'];
                const lightColors = ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0d9488', '#ea580c'];
                
                
                // Collapse nodes deeper than level 1 (0-indexed) so it doesn't shrink to microscopic size
                function collapseNodes(node, currentLevel = 0, maxLevel = 1) {
                    if (currentLevel >= maxLevel) {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = 1; // 1 means folded
                    }
                    if (node.children) {
                        node.children.forEach(child => collapseNodes(child, currentLevel + 1, maxLevel));
                    }
                }
                collapseNodes(root);
                
                mm = Markmap.create('#markmap', {
                    autoFit: true,
                    fitRatio: 0.9,
                    duration: 500,
                    paddingX: 8,
                    spacingHorizontal: 80,
                    color: (node) => {
                        const colors = isDark ? darkColors : lightColors;
                        return colors[node.depth % colors.length];
                    }
                }, root);
            }, 100);
        });

        // Control functions
        function zoomIn() { if(mm) mm.rescale(1.2); }
        function zoomOut() { if(mm) mm.rescale(0.8); }
        function fitMap() { if(mm) mm.fit(); }
    </script>
    <script type="module" src="firebase_tracker.js"></script>
