        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.remove('dark');
            htmlElement.classList.add('light');
        } else {
            htmlElement.classList.add('dark');
            htmlElement.classList.remove('light');
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = htmlElement.classList.contains('dark');
            htmlElement.classList.toggle('dark', !isDark);
            htmlElement.classList.toggle('light', isDark);
            localStorage.setItem('theme', !isDark ? 'dark' : 'light');
            // Hard reload map to reflect new colors if needed, but CSS handles text.

    - သန္တတိ
      - ရုပ်၏ အစဉ်မပြတ် ဖြစ်ပေါ်ခြင်း
    - ဇရတာ
      - ရုပ်၏ ရင့်ရော်ခြင်း
    - အနိစ္စတာ
      - ရုပ်၏ ပျက်စီးခြင်း
### ရုပ်ကလာပ် (၂၁) (ရုပ်များစုဝေးခြင်း)
- ကမ္မဇကလာပ် (၉) (ကံကြောင့်ဖြစ်သော ရုပ်အစုများ)
  - စက္ခုဒသက ကလာပ်
    - စက္ခုပသာဒကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (စက္ခုပသာဒ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - သောတဒသက ကလာပ်
    - သောတပသာဒကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (သောတပသာဒ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ဃာနဒသက ကလာပ်
    - ဃာနပသာဒကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ဃာနပသာဒ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ဇိဝှါဒသက ကလာပ်
    - ဇိဝှါပသာဒကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ဇိဝှါပသာဒ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ကာယဒသက ကလာပ်
    - ကာယပသာဒကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ကာယပသာဒ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ဣတ္ထိဘာဝဒသက ကလာပ်
    - ဣတ္ထိဘာဝရုပ်ကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ဣတ္ထိဘာဝ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ပုမ္ဘာဝဒသက ကလာပ်
    - ပုမ္ဘာဝရုပ်ကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ပုမ္ဘာဝ + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ဝတ္ထုဒသက ကလာပ်
    - ဟဒယဝတ္ထုရုပ်ကို အဓိကထား၍ ဖြစ်သော ရုပ် ၁၀-ပါး အစု (ဟဒယဝတ္ထု + အဝိနိဗ္ဘောဂ ၈ + ဇီဝိတ)
  - ဇီဝိတနဝက ကလာပ်
    - ဇီဝိတရုပ်ကို အဓိကထား၍ ဖြစ်သော ရုပ် ၉-ပါး အစု (ဇီဝိတ + အဝိနိဗ္ဘောဂ ၈)
- စိတ္တဇကလာပ် (၆) (စိတ်ကြောင့်ဖြစ်သော ရုပ်အစုများ)
  - သုဒ္ဓဋ္ဌက ကလာပ်
    - အဝိနိဗ္ဘောဂ ၈-ပါး သက်သက်သာ ပါဝင်သော ရုပ် ၈-ပါး အစု
  - ကာယဝိညတ္တိနဝက ကလာပ်
    - ကာယဝိညတ်ရုပ် ပါဝင်သော ရုပ် ၉-ပါး အစု (ကာယဝိညတ် + အဝိနိဗ္ဘောဂ ၈)
  - ဝစီဝိညတ္တိသဒ္ဒဒသက ကလာပ်
    - ဝစီဝိညတ်နှင့် သဒ္ဒရုပ် ပါဝင်သော ရုပ် ၁၀-ပါး အစု (ဝစီဝိညတ် + သဒ္ဒ + အဝိနိဗ္ဘောဂ ၈)
  - လဟုတာဒိဧကာဒသက ကလာပ်
    - လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၁-ပါး အစု (လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)
  - ကာယဝိညတ္တိလဟုတာဒိဒွါဒသက ကလာပ်
    - ကာယဝိညတ်နှင့် လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၂-ပါး အစု (ကာယဝိညတ် + လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)
  - ဝစီဝိညတ္တိသဒ္ဒလဟုတာဒိတေရသက ကလာပ်
    - ဝစီဝိညတ်၊ သဒ္ဒနှင့် လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၃-ပါး အစု (ဝစီဝိညတ် + သဒ္ဒ + လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)
- ဥတုဇကလာပ် (၄) (ဥတုကြောင့်ဖြစ်သော ရုပ်အစုများ)
  - သုဒ္ဓဋ္ဌက ကလာပ်
    - အဝိနိဗ္ဘောဂ ၈-ပါး သက်သက်သာ ပါဝင်သော ရုပ် ၈-ပါး အစု
  - သဒ္ဒနဝက ကလာပ်
    - သဒ္ဒရုပ် ပါဝင်သော ရုပ် ၉-ပါး အစု (သဒ္ဒ + အဝိနိဗ္ဘောဂ ၈)
  - လဟုတာဒိဧကာဒသက ကလာပ်
    - လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၁-ပါး အစု (လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)
  - သဒ္ဒလဟုတာဒိဒွါဒသက ကလာပ်
    - သဒ္ဒရုပ်နှင့် လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၂-ပါး အစု (သဒ္ဒ + လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)
- အာဟာရဇကလာပ် (၂) (အာဟာရကြောင့်ဖြစ်သော ရုပ်အစုများ)
  - သုဒ္ဓဋ္ဌက ကလာပ်
    - အဝိနိဗ္ဘောဂ ၈-ပါး သက်သက်သာ ပါဝင်သော ရုပ် ၈-ပါး အစု
  - လဟုတာဒိဧကာဒသက ကလာပ်
    - လဟုတာဒိ ၃-ပါး ပါဝင်သော ရုပ် ၁၁-ပါး အစု (လဟုတာဒိ ၃ + အဝိနိဗ္ဘောဂ ၈)

## နိဗ္ဗာန်

    - ပဉ္စဒွါရာဝဇ္ဇန်း

    - စက္ခုဝိညာဉ်

- မနောဒွါရဝီထိ

  - ဘဝင်္ဂုပစ္ဆေဒ

  - မနောဒွါရာဝဇ္ဇန်း

- အပ္ပနာဝီထိ

## ဝီထိမုတ္တ
### ဘုံ (၃၁) 
- အပါယ် (၄) ဘုံ
  - ငရဲ
    - ပြင်းစွာ ဆင်းရဲသော ဘုံ
  - တိရစ္ဆာန်
    - မတ်တတ်မသွားဘဲ ဖီလာသွားသော သတ္တဝါတို့၏ ဘုံ
  - ပြိတ္တာ
    - ချမ်းသာမှုနှင့် ကင်းကွာသော သတ္တဝါတို့၏ ဘုံ
  - အသုရကာယ်
    - ရဲရင့်ခြင်းကင်းသော သတ္တဝါတို့၏ ဘုံ
- ကာမသုဂတိ (၇) ဘုံ
  - လူ (၁)
    - အကြောင်းအကျိုးကို သိနားလည်သော သတ္တဝါတို့၏ ဘုံ
  - နတ် (၆)
    - စာတုမဟာရာဇ်
      - နတ်မင်းကြီး လေးပါး အုပ်ချုပ်သော နတ်ပြည်
    - တာဝတိံသာ
      - နတ်မင်း ၃၃ ပါး အုပ်ချုပ်သော နတ်ပြည်
    - ယာမာ
      - ဆင်းရဲဒုက္ခမှ ကင်းလွတ်သော နတ်ပြည်
    - တုသိတာ
      - ရောင့်ရဲလွယ်သော နတ်ပြည်
    - နိမ္မာနရတိ
      - မိမိဖန်ဆင်းသော အာရုံ၌ မွေ့လျော်သော နတ်ပြည်
    - ပရနိမ္မိတဝသဝတ္တီ
      - သူတစ်ပါး ဖန်ဆင်းပေးသော အာရုံ၌ မွေ့လျော်သော နတ်ပြည်
- ရူပ (၁၆) ဘုံ
  - ပဌမဈာန် (၃)
    - ဗြဟ္မပါရိသဇ္ဇာ
      - မဟာဗြဟ္မာ၏ ပရိသတ်ဖြစ်သော ဗြဟ္မာများ
    - ဗြဟ္မပုရောဟိတာ
      - မဟာဗြဟ္မာ၏ အတိုင်ပင်ခံဖြစ်သော ဗြဟ္မာများ
    - မဟာဗြဟ္မာ
      - ကြီးမြတ်သော ဗြဟ္မာကြီး
  - ဒုတိယဈာန် (၃)
    - ပရိတ္တာဘာ
      - အနည်းငယ်သော အရောင်အဆင်းရှိသော ဗြဟ္မာများ
    - အပ္ပမာဏာဘာ
      - အတိုင်းအရှည်မရှိသော အရောင်အဆင်းရှိသော ဗြဟ္မာများ
    - အာဘဿရာ
      - ကိုယ်ရောင်ကိုယ်ဝါ တောက်ပသော ဗြဟ္မာများ
  - တတိယဈာန် (၃)
    - ပရိတ္တသုဘာ
      - အနည်းငယ်သော တင့်တယ်ခြင်းရှိသော ဗြဟ္မာများ
    - အပ္ပမာဏသုဘာ
      - အတိုင်းအရှည်မရှိသော တင့်တယ်ခြင်းရှိသော ဗြဟ္မာများ
    - သုဘကိဏှာ
      - အပြည့်အဝ တင့်တယ်ခြင်းရှိသော ဗြဟ္မာများ
  - စတုတ္ထဈာန် (၇)
    - ဝေဟပ္ဖိုလ်
      - များပြားသော အကျိုးရှိသော ဗြဟ္မာများ
    - အသညသတ်
      - နာမ်တရား(စိတ်) မရှိဘဲ ရုပ်သာရှိသော ဗြဟ္မာများ
    - သုဒ္ဓါဝါသ (၅)
      - အဝိဟာ
        - မိမိတို့၏ စည်းစိမ်မှ မဆုတ်ယုတ်သော ဗြဟ္မာများ
      - အတပ္ပါ
        - ပူပန်ခြင်း ကင်းသော ဗြဟ္မာများ
      - သုဒဿာ
        - ကြည်ညိုဖွယ် ကောင်းသော ဗြဟ္မာများ
      - သုဒဿီ
        - အလွန် ကြည်ညိုဖွယ် ကောင်းသော ဗြဟ္မာများ
      - အကနိဋ္ဌ
        - ဂုဏ်သိမ်အကြီးဆုံး ဗြဟ္မာများ
- အရူပ (၄) ဘုံ
  - အာကာသာနဉ္စာယတန
    - ကောင်းကင်ပညတ်ကို အာရုံပြုသောစိတ်
  - ဝိညာဏဉ္စာယတန

  - အိုခြင်းနှင့် သေခြင်း
- ကာလ (၃) ပါး
  - အတိတ်ကာလ
    - အဝိဇ္ဇာ၊ သင်္ခါရ
  - ပစ္စုပ္ပန်ကာလ
    - ဝိညာဏ် မှ ဘဝ အထိ ၈ ပါး
  - အနာဂတ်ကာလ
    - ဇာတိ၊ ဇရာ-မရဏ
- အစပ် (၃) စပ်
  - အတိတ် နှင့် ပစ္စုပ္ပန် အစပ်
    - သင်္ခါရ နှင့် ဝိညာဏ်
  - ပစ္စုပ္ပန် အကြောင်း နှင့် အကျိုး အစပ်
    - ဝေဒနာ နှင့် တဏှာ
  - ပစ္စုပ္ပန် နှင့် အနာဂတ် အစပ်
    - ဘဝ နှင့် ဇာတိ
- ဝဋ် (၃) ပါး
  - ကိလေသဝဋ်
    - အဝိဇ္ဇာ၊ တဏှာ၊ ဥပါဒါန်
  - ကမ္မဝဋ်
    - သင်္ခါရ၊ ကမ္မဘဝ
  - ဝိပါကဝဋ်
    - ဝိညာဏ်၊ နာမ်ရုပ်၊ သဠာယတန၊ ဖဿ၊ ဝေဒနာ၊ ဥပပတ္တိဘဝ၊ ဇာတိ၊ ဇရာ-မရဏ
### ပဋ္ဌာန်း (ပစ္စည်း ၂၄ ပါး)
- ဟေတု ပစ္စည်း
  - အကြောင်းရင်းဖြစ်၍ ကျေးဇူးပြုသော တရား
- အာရမ္မဏ ပစ္စည်း
  - အာရုံဖြစ်၍ ကျေးဇူးပြုသော တရား
- အဓိပတိ ပစ္စည်း
  - အကြီးအမှူးဖြစ်၍ ကျေးဇူးပြုသော တရား
- အနန္တရ ပစ္စည်း
  - အကြားမရှိ ဆက်တိုက်ဖြစ်၍ ကျေးဇူးပြုသော တရား
- သမနန္တရ ပစ္စည်း
  - ကောင်းစွာ အကြားမရှိ ဆက်တိုက်ဖြစ်၍ ကျေးဇူးပြုသော တရား
- သဟဇာတ ပစ္စည်း
  - အတူတကွ ဖြစ်၍ ကျေးဇူးပြုသော တရား
- အညမည ပစ္စည်း
  - အချင်းချင်း အပြန်အလှန် ကျေးဇူးပြုသော တရား
- နိဿယ ပစ္စည်း
  - မှီရာဖြစ်၍ ကျေးဇူးပြုသော တရား
- ဥပနိဿယ ပစ္စည်း
  - အားကြီးသော မှီရာအကြောင်းဖြစ်၍ ကျေးဇူးပြုသော တရား
- ပုရေဇာတ ပစ္စည်း
  - ရှေ့မှ ဖြစ်နှင့်၍ ကျေးဇူးပြုသော တရား
- ပစ္ဆာဇာတ ပစ္စည်း
  - နောက်မှ ဖြစ်၍ ကျေးဇူးပြုသော တရား
- အာသေဝန ပစ္စည်း
  - အကြိမ်ကြိမ် အထပ်ထပ် ဖြစ်၍ ကျေးဇူးပြုသော တရား
- ကမ္မ ပစ္စည်း
  - ပြုလုပ်စီမံတတ်သော သဘောဖြင့် ကျေးဇူးပြုသော တရား
- ဝိပါက ပစ္စည်း
  - အကျိုးဖြစ်၍ ကျေးဇူးပြုသော တရား
- အာဟာရ ပစ္စည်း
  - ထောက်ပံ့ ခိုင်ခံ့စေတတ်သော သဘောဖြင့် ကျေးဇူးပြုသော တရား
- ဣန္ဒြိယ ပစ္စည်း
  - အစိုးရသော သဘောဖြင့် ကျေးဇူးပြုသော တရား
- ဈာန ပစ္စည်း
  - အာရုံကို စူးစူးစိုက်စိုက် ရှုတတ်သော သဘောဖြင့် ကျေးဇူးပြုသော တရား
- မဂ္ဂ ပစ္စည်း
  - ထွက်မြောက်ကြောင်း (သို့မဟုတ်) ရောက်ကြောင်းဖြစ်၍ ကျေးဇူးပြုသော တရား
- သမ္ပယုတ္တ ပစ္စည်း
  - အတူတကွ ယှဉ်တွဲ၍ ကျေးဇူးပြုသော တရား
- ဝိပ္ပယုတ္တ ပစ္စည်း
  - မယှဉ်တွဲဘဲ ကင်းကွာ၍ ကျေးဇူးပြုသော တရား
- အတ္ထိ ပစ္စည်း
  - ထင်ရှားရှိဆဲဖြစ်၍ ကျေးဇူးပြုသော တရား
- နတ္ထိ ပစ္စည်း
  - မရှိတော့ဘဲ (ချုပ်ကင်းသွား၍) ကျေးဇူးပြုသော တရား
- ဝိဂတ ပစ္စည်း
  - ကင်းပျောက်သွား၍ ကျေးဇူးပြုသော တရား
- အဝိဂတ ပစ္စည်း
  - မကင်းသေးဘဲ (ရှိဆဲ) ကျေးဇူးပြုသော တရား

## ပညတ်
### သဒ္ဒပညတ် (၆) (အမည်ပညတ်)
- ဝိဇ္ဇမာနပညတ် (ရှိသောတရားကို ခေါ်ဝေါ်ခြင်း)
  - ပရမတ္ထအားဖြင့် အမှန်တကယ်ထင်ရှားရှိသော တရားကို အမည်ပေးခေါ်ဝေါ်ခြင်း (ဥပမာ - ရုပ်၊ နာမ်၊ စိတ်၊ စေတသိက်၊ မြေ၊ ရေ၊ မီး၊ လေ)
- အဝိဇ္ဇမာနပညတ် (မရှိသောတရားကို ခေါ်ဝေါ်ခြင်း)
  - ပရမတ္ထအားဖြင့် အမှန်တကယ်ထင်ရှားမရှိသော အရာကို အမည်ပေးခေါ်ဝေါ်ခြင်း (ဥပမာ - ယောက်ျား၊ မိန်းမ၊ ကား၊ အိမ်၊ နေ၊ လ)
- ဝိဇ္ဇမာနေန အဝိဇ္ဇမာနပညတ် (ရှိတရားဖြင့် မရှိတရားကို ခေါ်ဝေါ်ခြင်း)
  - ရှေ့ပုဒ်က ပရမတ်ရှိတရား၊ နောက်ပုဒ်က ပရမတ်မရှိတရား (ဥပမာ - ရုပ်ပုံ၊ အဘိညာဉ်ရသူ၊ ဈာန်အနွယ်)
- အဝိဇ္ဇမာနေန ဝိဇ္ဇမာနပညတ် (မရှိတရားဖြင့် ရှိတရားကို ခေါ်ဝေါ်ခြင်း)
  - ရှေ့ပုဒ်က ပရမတ်မရှိတရား၊ နောက်ပုဒ်က ပရမတ်ရှိတရား (ဥပမာ - မိန်းမအသံ၊ မင်းအမျက်၊ နတ်ရုပ်)
- ဝိဇ္ဇမာနေန ဝိဇ္ဇမာနပညတ် (ရှိတရားဖြင့် ရှိတရားကို ခေါ်ဝေါ်ခြင်း)
  - ရှေ့ပုဒ်က ပရမတ်ရှိတရား၊ နောက်ပုဒ်က ပရမတ်ရှိတရား (ဥပမာ - စက္ခုဝိညာဉ်၊ သောတဝိညာဉ်)
- အဝိဇ္ဇမာနေန အဝိဇ္ဇမာနပညတ် (မရှိတရားဖြင့် မရှိတရားကို ခေါ်ဝေါ်ခြင်း)
  - ရှေ့ပုဒ်က ပရမတ်မရှိတရား၊ နောက်ပုဒ်က ပရမတ်မရှိတရား (ဥပမာ - သူဌေးသား၊ မင်းသား)
### အတ္ထပညတ် (၇) (အနက်အဓိပ္ပာယ်ပညတ်)
- သန္တာနပညတ် (အစဉ်အတန်း)
  - အရာဝတ္ထုတို့၏ ဆက်စပ်နေသော အစဉ်အတန်း သဏ္ဌာန်ကိုစွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - တောင်တန်း၊ သစ်ပင်၊ မြစ်၊ လမ်း)
- သမူဟပညတ် (အစုအဝေး)
  - အစိတ်အပိုင်းများစွာ စုပေါင်းဖွဲ့စည်းထားသော အစုအဝေးကိုစွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - အိမ်၊ ရထား၊ တပ်မတော်၊ ကျောင်း)
- သတ္တပညတ် (သတ္တဝါ)
  - ခန္ဓာငါးပါး အစုအဝေးကို ပုဂ္ဂိုလ်၊ သတ္တဝါအဖြစ် အထင်အမြင်စွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - လူ၊ နတ်၊ ဗြဟ္မာ၊ ခွေး၊ မြင်း)
- ဒိသာပညတ် (အရပ်မျက်နှာ)
  - နေထွက်၊ နေဝင် စသည်တို့ကို အကြောင်းပြု၍ အရပ်မျက်နှာကိုစွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - အရှေ့၊ အနောက်၊ တောင်၊ မြောက်)
- ကာလပညတ် (အချိန်ကာလ)
  - နေ၊ လ၊ ရာသီဥတုတို့၏ ပြောင်းလဲမှုကိုစွဲ၍ အချိန်ကာလအားဖြင့် ခေါ်ဝေါ်ခြင်း (ဥပမာ - မနက်၊ ည၊ နွေ၊ မိုး၊ ဆောင်း)
- အာကာသပညတ် (ဟင်းလင်းပြင်)
  - အရာဝတ္ထုတို့နှင့် မထိစပ်သော ဟင်းလင်းပြင် (ကွက်လပ်) ကိုစွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - တွင်း၊ လိုဏ်ဂူ၊ ပြတင်းပေါက်)
- နိမိတ္တပညတ် (အမှတ်အသား)
  - ကမ္မဋ္ဌာန်းအားထုတ်ရာတွင် စိတ်ထဲ၌ ထင်လာသော အမှတ်အသားကိုစွဲ၍ ခေါ်ဝေါ်ခြင်း (ဥပမာ - ပရိကမ္မနိမိတ်၊ ဥဂ္ဂဟနိမိတ်၊ ပဋိဘာဂနိမိတ်)
### အခြား အတ္ထပညတ်များ (ဋီကာနှင့် ဒီပနီလာ)
- သန္တတိပညတ်
  - ရုပ်နာမ်တို့၏ အစဉ်မပြတ် ဆက်တိုက်ဖြစ်ပေါ်နေမှုကို စွဲ၍ ခေါ်ဝေါ်သော ပညတ် (ဥပမာ - ရုပ်ရှင်၊ အသံလှိုင်း၊ သက်တမ်း)
- ကိစ္စပညတ်
  - ပြုလုပ်သော အလုပ် (Function) ကို စွဲ၍ ခေါ်ဝေါ်သော ပညတ် (ဥပမာ - ဆရာဝန်၊ ကျောင်းဆရာ၊ ရဟန်း)
- လိင်္ဂပညတ်
  - ယောက်ျား၊ မိန်းမ စသည့် အသွင်အပြင် လက္ခဏာ (Sign/Gender) ကို စွဲ၍ ခေါ်ဝေါ်သော ပညတ် (ဥပမာ - ယောက်ျား၊ မိန်းမ၊ ရသေ့)
- ဥပါဒါပညတ်
  - အခြားအရာတစ်ခုကို မှီခို၍ သို့မဟုတ် အကြောင်းပြု၍ ဖြစ်ပေါ်လာသော ပညတ် (ဥပမာ - အရိပ်၊ မှန်ထဲက ပုံရိပ်)
### အဘိဓမ္မာလာ အထူးပညတ်များ
- ပုဂ္ဂလပညတ်
  - ရုပ်နာမ်(ခန္ဓာ ၅ ပါး) အစုအဝေးကို အကြောင်းပြု၍ သတ်မှတ်ခေါ်ဝေါ်သော ပညတ် (ဥပမာ - အရိယာ ၄ မျိုး၊ ပုထုဇဉ် ၄ မျိုး)
- ခန္ဓပညတ်
  - ရုပ်၊ ဝေဒနာ၊ သညာ၊ သင်္ခါရ၊ ဝိညာဉ် ဟူသော တရားအစုအဝေးကြီး ၅ ခု အဖြစ် ပညတ်ထားခြင်း (ဥပမာ - ရူပက္ခန္ဓာ၊ ဝေဒနက္ခန္ဓာ)
- အာယတန နှင့် ဓာတု ပညတ်
  - အာရုံနှင့် ဒွါရ တိုက်ဆိုင်မှုနယ်ပယ် (၁၂ ပါး) နှင့် အခြေခံ ဓာတ်သဘောတရား (၁၈ ပါး) အဖြစ် ပညတ်ထားခြင်း (ဥပမာ - စက္ခာယတန၊ စက္ခုဓာတု)

  - ဝိပုဗ္ဗက
    - ပြည်ယိုကျနေသော အလောင်း
  - ဝိစ္ဆိဒ္ဒက
    - ပြတ်တောက်နေသော အလောင်း
  - ဝိက္ခာယိတက
    - တိရစ္ဆာန်တို့ ကိုက်ခဲထားသော အလောင်း
  - ဝိက္ခိတ္တက
    - ဖရိုဖရဲကြဲ흩နေသော အလောင်း
  - ဟတဝိက္ခိတ္တက
    - ဓားလှံစသည်တို့ဖြင့် ခုတ်ထစ်ထားသော အလောင်း
  - လောဟိတက
    - သွေးသံရဲရဲဖြစ်နေသော အလောင်း
  - ပုဠုဝက
    - ပိုးလောက်တို့ဖြင့် ပြည့်နှက်နေသော အလောင်း
  - အဋ္ဌိက
    - အရိုးစုအလောင်း
- အနုဿတိ (၁၀)
  - ဗုဒ္ဓါနုဿတိ
    - ဘုရားဂုဏ်ကို အောက်မေ့ခြင်း
  - ဓမ္မာနုဿတိ
    - တရားဂုဏ်ကို အောက်မေ့ခြင်း
  - သံဃာနုဿတိ
    - သံဃာ့ဂုဏ်ကို အောက်မေ့ခြင်း
  - သီလာနုဿတိ
    - မိမိသီလကို အောက်မေ့ခြင်း
  - စာဂါနုဿတိ
    - မိမိအလှူကို အောက်မေ့ခြင်း
  - ဒေဝတာနုဿတိ
    - နတ်တို့၏ အရည်အချင်းကို အောက်မေ့ခြင်း
  - ဥပသမာနုဿတိ
    - နိဗ္ဗာန်၏ ငြိမ်းချမ်းမှုကို အောက်မေ့ခြင်း
  - မရဏာနုဿတိ
    - သေခြင်းတရားကို အောက်မေ့ခြင်း
  - ကာယဂတာသတိ
    - ခန္ဓာကိုယ်၏ အဆင်းသဏ္ဌာန်ကို အောက်မေ့ခြင်း
  - အာနာပါနဿတိ
    - ထွက်သက်ဝင်သက်ကို အောက်မေ့ခြင်း
- အပ္ပမညာ (၄)
  - မေတ္တာ
    - ချစ်ခင်ကြင်နာမှု
  - ကရုဏာ
    - သနားကြင်နာမှု
  - မုဒိတာ

  - ဥပေက္ခာ

    - ကောင်းကင်ပညတ်ကို အာရုံပြုခြင်း

### ဝိပဿနာ 
- လက္ခဏာ (၃) ပါး

  - အနတ္တ

  - ဒုက္ခာနုပဿနာ
    - ဆင်းရဲဟု ရှုခြင်း
  - အနတ္တာနုပဿနာ

- ဝိမောက္ခ (၃) ပါး
  - သုညတ

  - အနိမိတ္တ

  - အပ္ပဏိဟိတ
    - ဒုက္ခကို ရှု၍ လွတ်မြောက်ခြင်း
- ဝိသုဒ္ဓိ (၇) ပါး
  - သီလ ဝိသုဒ္ဓိ
    - အကျင့်သီလ စင်ကြယ်ခြင်း
  - စိတ္တ ဝိသုဒ္ဓိ
    - စိတ် (သမာဓိ) စင်ကြယ်ခြင်း
  - ဒိဋ္ဌိ ဝိသုဒ္ဓိ
    - အမြင် (နာမ်ရုပ်ကို ခွဲခြားသိမှု) စင်ကြယ်ခြင်း
  - ကင်္ခါဝိတရဏ ဝိသုဒ္ဓိ
    - ယုံမှားသံသယကို လွန်မြောက်၍ စင်ကြယ်ခြင်း
  - မဂ္ဂါမဂ္ဂဉာဏဒဿန ဝိသုဒ္ဓိ
    - လမ်းမှန် လမ်းမှားကို ခွဲခြားသိမြင်၍ စင်ကြယ်ခြင်း
  - ပဋိပဒါဉာဏဒဿန ဝိသုဒ္ဓိ
    - အကျင့်လမ်းစဉ်ကို သိမြင်၍ စင်ကြယ်ခြင်း
  - ဉာဏဒဿန ဝိသုဒ္ဓိ
    - မဂ်ဉာဏ် ဖိုလ်ဉာဏ်ဖြင့် အမှန်အတိုင်း သိမြင်၍ စင်ကြယ်ခြင်း
- ဉာဏ်စဉ် (၁၆) ပါး
  - နာမရူပပရိစ္ဆေဒဉာဏ်
    - ရုပ်နှင့် နာမ်တရားတို့ကို ကွဲပြားစွာ ပိုင်းခြားသိမြင်သောဉာဏ်
  - ပစ္စယပရိဂ္ဂဟဉာဏ်
    - ရုပ်နာမ်တို့၏ အကြောင်းရင်းကို သိမ်းဆည်းသိမြင်သောဉာဏ်
  - သမ္မသနဉာဏ်
    - ရုပ်နာမ်တို့ကို အနိစ္စ, ဒုက္ခ, အနတ္တ လက္ခဏာရေး ၃ ပါးဖြင့် သုံးသပ်ဆင်ခြင်သောဉာဏ်
  - ဥဒယဗ္ဗယဉာဏ်
    - ရုပ်နာမ်တို့၏ အဖြစ် (ဥဒယ) နှင့် အပျက် (ဝယ) ကို သိမြင်သောဉာဏ်
  - ဘင်္ဂဉာဏ်
    - ရုပ်နာမ်တို့၏ ပျက်ခြင်းကိုသာ အာရုံပြု၍ သိမြင်သောဉာဏ်
  - ဘယဉာဏ်
    - ခန္ဓာငါးပါးကို ဘေးရန်ကြီးတစ်ခုအဖြစ် ကြောက်မက်ဖွယ် သိမြင်သောဉာဏ်
  - အာဒီနဝဉာဏ်
    - ခန္ဓာငါးပါး၏ အပြစ်ကို သိမြင်သောဉာဏ်
  - နိဗ္ဗိဒါဉာဏ်
    - ခန္ဓာငါးပါးအပေါ် ငြီးငွေ့သောဉာဏ်
  - မုဉ္စိတုကမျတာဉာဏ်
    - ခန္ဓာငါးပါးမှ လွတ်မြောက်လိုသောဉာဏ်
  - ပဋိသင်္ခါဉာဏ်
    - လွတ်မြောက်ရန်အတွက် ထပ်မံ၍ လက္ခဏာရေး ၃ ပါးဖြင့် ဆင်ခြင်သောဉာဏ်
  - သင်္ခါရုပေက္ခာဉာဏ်
    - သင်္ခါရတရားတို့အပေါ် လျစ်လျူရှုနိုင်သော တည်ကြည်သောဉာဏ်
  - အနုလောမဉာဏ်
    - မဂ်ဖိုလ်နှင့် လျော်ညီစွာ အနုလုံ (လိုက်လျော) ဖြစ်ပေါ်လာသောဉာဏ်
  - ဂေါတြဘူဉာဏ်
    - ပုထုဇဉ်အနွယ်ကို ဖြတ်၍ အရိယာအနွယ်သို့ ကူးပြောင်းသောဉာဏ် (နိဗ္ဗာန်ကို ပထမဆုံး အာရုံပြု)
  - မဂ္ဂဉာဏ်
    - ကိလေသာတို့ကို ပယ်သတ်၍ နိဗ္ဗာန်ကို အာရုံပြုသောဉာဏ်
  - ဖိုလ်ဉာဏ်
    - မဂ်၏အကျိုးအဖြစ် နိဗ္ဗာန်ကို ငြိမ်းချမ်းစွာ ခံစားသောဉာဏ်
  - ပစ္စဝေက္ခဏာဉာဏ်
    - မဂ်, ဖိုလ်, နိဗ္ဗာန်, ပယ်အပ်သော ကိလေသာ, မပယ်ရသေးသော ကိလေသာတို့ကို ပြန်လည်ဆင်ခြင်သောဉာဏ်
`;

        let mm;
        let mapRoot;
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const { Transformer } = window.markmap;
                const { Markmap } = window.markmap;

                const transformer = new Transformer();
                const { root } = transformer.transform(markdown);
                mapRoot = root;
                
                // Set high contrast bright colors for branches in dark mode, and darker for light mode
                const isDark = document.documentElement.classList.contains('dark');
                const darkColors = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#c084fc', '#2dd4bf', '#fb923c'];
                const lightColors = ['#2563eb', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0d9488', '#ea580c'];
                
                
                // Collapse nodes deeper than level 1 (0-indexed) so it doesn't shrink to microscopic size
                function collapseNodes(node, currentLevel = 0, maxLevel = 1) {
                    if (currentLevel >= maxLevel) {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = 1; // 1 means folded
                    }
                    if (node.children) {
                        node.children.forEach(child => collapseNodes(child, currentLevel + 1, maxLevel));
                    }
                }
                collapseNodes(root);
                
                mm = Markmap.create('#markmap', {
                    autoFit: true,
                    fitRatio: 0.9,
                    duration: 250,
                    paddingX: 8,
                    spacingHorizontal: 80,
                    color: (node) => {
                        const colors = isDark ? darkColors : lightColors;
                        return colors[node.depth % colors.length];
                    }
                }, root);
                
                // Fix for iOS/iPad Safari: ensure it fits when container resizes
                const resizeObserver = new ResizeObserver(() => {
                    if (mm) {
                        setTimeout(() => mm.fit(), 50);
                    }
                });
                resizeObserver.observe(document.getElementById('markmap-container'));
                
                // Extra fit call to catch delayed layout computation on iOS WebKit
                setTimeout(() => mm.fit(), 300);
                setTimeout(() => mm.fit(), 1000);
                
                // Search Functionality
                const searchInput = document.getElementById('search-input');
                const searchControls = document.getElementById('search-controls');
                const searchCounter = document.getElementById('search-counter');
                const searchPrev = document.getElementById('search-prev');
                const searchNext = document.getElementById('search-next');
                
                let searchResults = [];
                let currentSearchIndex = -1;
                
                function resetAndCollapse(node, currentLevel = 0, maxLevel = 1) {
                    if (currentLevel >= maxLevel) {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = 1; 
                    } else {
                        if (node.payload) node.payload.fold = 0;
                    }
                    if (node.children) {
                        node.children.forEach(child => resetAndCollapse(child, currentLevel + 1, maxLevel));
                    }
                }

                function searchMap(query) {
                    query = query.toLowerCase();
                    searchResults = [];
                    currentSearchIndex = -1;
                    
                    if (!query) {
                        searchControls.style.display = 'none';
                        resetAndCollapse(root);
                        mm.setData(root);
                        mm.fit();
                        highlightTarget(null);
                        return;
                    }
                    
                    // Traverse and find all matches, tracking parent paths
                    function findMatches(node, path) {
                        if (node.content && node.content.toLowerCase().includes(query)) {
                            searchResults.push({ node, path: [...path, node] });
                        }
                        if (node.children) {
                            node.children.forEach(child => findMatches(child, [...path, node]));
                        }
                    }
                    
                    findMatches(root, []);
                    
                    if (searchResults.length > 0) {
                        searchControls.style.display = 'flex';
                        currentSearchIndex = 0;
                        focusResult();
                    } else {
                        searchControls.style.display = 'none';
                        resetAndCollapse(root);
                        mm.setData(root);
                        mm.fit();
                        highlightTarget(null);
                    }
                }
                
                function focusResult() {
                    if (currentSearchIndex < 0 || currentSearchIndex >= searchResults.length) return;
                    
                    searchCounter.innerText = (currentSearchIndex + 1) + " / " + searchResults.length;
                    
                    // Fold everything first
                    resetAndCollapse(root);
                    
                    // Unfold the specific path
                    const path = searchResults[currentSearchIndex].path;
                    path.forEach(node => {
                        if (!node.payload) node.payload = {};
                        node.payload.fold = 0;
                    });
                    
                    mm.setData(root);
                    mm.fit();
                    
                    // Highlight ONLY the current target node
                    highlightTarget(searchResults[currentSearchIndex].node.content);
                }
                
                function highlightTarget(targetContent) {
                    setTimeout(() => {
                        const gs = document.querySelectorAll('#markmap g.markmap-node');
                        gs.forEach(g => {
                            const textEl = g.querySelector('text, foreignObject');
                            if (textEl && targetContent && textEl.textContent.trim() === targetContent.replace(/<[^>]*>?/gm, '').trim()) {
                                g.classList.add('highlight-match');
                            } else if (textEl && targetContent && textEl.textContent.includes(targetContent.replace(/<[^>]*>?/gm, ''))) {
                                // Fallback partial match if HTML tags exist
                                g.classList.add('highlight-match');
                            } else {
                                g.classList.remove('highlight-match');
                            }
                        });
                    }, 600); // wait for SVG render
                }
                
                searchInput.addEventListener('input', (e) => {
                    searchMap(e.target.value);
                });
                
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        if (searchResults.length > 0) {
                            currentSearchIndex = (currentSearchIndex + 1) % searchResults.length;
                            focusResult();
                        }
                    }
                });
                
                searchNext.addEventListener('click', () => {
                    if (searchResults.length > 0) {
                        currentSearchIndex = (currentSearchIndex + 1) % searchResults.length;
                        focusResult();
                    }
                });
                
                searchPrev.addEventListener('click', () => {
                    if (searchResults.length > 0) {
                        currentSearchIndex = (currentSearchIndex - 1 + searchResults.length) % searchResults.length;
                        focusResult();
                    }
                });
                
            }, 100);
        });

        // Control functions
        function zoomIn() { if(mm) mm.rescale(1.2); }
        function zoomOut() { if(mm) mm.rescale(0.8); }
        function fitMap() { if(mm) mm.fit(); }
        
        let currentMode = 'pan';
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-select').classList.toggle('active', mode === 'select');
            document.getElementById('btn-pan').classList.toggle('active', mode === 'pan');
            
            const svg = document.getElementById('markmap');
            if (mode === 'select') {
                svg.classList.add('select-mode');
                svg.classList.remove('pan-mode');
            } else {
                svg.classList.add('pan-mode');
                svg.classList.remove('select-mode');
            }
        }
        
        function expandAll() {
            if (!mm || !mapRoot) return;
            function setFold(node) {
                if (!node.payload) node.payload = {};
                node.payload.fold = 0;
                if (node.children) node.children.forEach(setFold);
            }
            setFold(mapRoot);
            mm.setData(mapRoot);
            mm.fit();
        }

        function collapseAll() {
            if (!mm || !mapRoot) return;
            function setFold(node, depth) {
                if (!node.payload) node.payload = {};
                if (depth >= 1) node.payload.fold = 1;
                else node.payload.fold = 0;
                if (node.children) node.children.forEach(c => setFold(c, depth + 1));
            }
            setFold(mapRoot, 0);
            mm.setData(mapRoot);
            mm.fit();
        }
    </script>
