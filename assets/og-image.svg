<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111c31"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent frame -->
  <rect x="28" y="28" width="1144" height="574" rx="24" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="8" rx="4" fill="#fbbf24"/>

  <!-- eyebrow -->
  <text x="600" y="150" text-anchor="middle"
        font-family="Padauk, 'Noto Serif Myanmar', sans-serif" font-size="30"
        fill="#fbbf24" letter-spacing="6">ABHIDHAMMA · VISUAL GUIDE</text>

  <!-- main Myanmar title -->
  <text x="600" y="300" text-anchor="middle"
        font-family="Padauk, 'Noto Serif Myanmar', sans-serif" font-size="104"
        font-weight="700" fill="#f8fafc">အဘိဓမ္မတ္ထသင်္ဂဟ</text>

  <!-- subtitle -->
  <text x="600" y="390" text-anchor="middle"
        font-family="Padauk, 'Noto Serif Myanmar', sans-serif" font-size="46"
        fill="#cbd5e1">ပရိစ္ဆေဒ (၉) ခန်းလုံး၏ Visual Guide</text>

  <!-- keyword chips row -->
  <text x="600" y="470" text-anchor="middle"
        font-family="Padauk, 'Noto Serif Myanmar', sans-serif" font-size="34"
        fill="#94a3b8">စိတ် · စေတသိက် · ရုပ် · ပဋိစ္စသမုပ္ပါဒ် · ဘာဝနာ</text>

  <!-- author -->
  <text x="600" y="560" text-anchor="middle"
        font-family="Padauk, 'Noto Serif Myanmar', sans-serif" font-size="28"
        fill="#64748b">မောင်ဝဏ္ဏကို — Maung Wunna Ko</text>
</svg>
